  <path class="k" d="M258 112H326Q322 132 292 132Q262 132 258 112Z"/>
  <path class="o" d="M254 108H322Q318 128 288 128Q258 128 254 108Z" fill="#fff"/>
  <rect class="k" x="267" y="75" width="52" height="38" rx="6"/>
  <rect class="o" x="262" y="70" width="52" height="38" rx="6" fill="#f0ff70"/>
  <path class="o" style="stroke-width:2.6" d="M281 78q-6 0-6 6v3q0 4-4 4q4 0 4 4v3q0 6 6 6M295 78q6 0 6 6v3q0 4 4 4q-4 0-4 4v3q0 6-6 6"/>
  <!-- pivot -->
  <circle class="o" cx="180" cy="60" r="10" fill="#f0ff70"/>
  <!-- sparkles -->
  <path class="o" style="stroke-width:2.5" d="M326 150L330 160L340 164L330 168L326 178L322 168L312 164L322 160Z" fill="#fff"/>
  <path class="o" style="stroke-width:2.5" d="M34 34L37 42L45 45L37 48L34 56L31 48L23 45L31 42Z" fill="#ffc4f2"/>
