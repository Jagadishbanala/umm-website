<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" fill="none">
  <title>Buy or build: a scale weighing ready-made software against custom code</title>
  <style>.o{stroke:#100e14;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.k{fill:#100e14}</style>
  <!-- stand -->
  <rect class="k" x="135" y="193" width="100" height="16" rx="8"/>
  <rect class="o" x="130" y="188" width="100" height="16" rx="8" fill="#fff"/>
  <path class="o" style="stroke-width:6" d="M180 62V188"/>
  <!-- beam + strings -->
  <path class="o" style="stroke-width:6" d="M66 70L294 50"/>
  <path class="o" style="stroke-width:2" d="M72 69L44 128M72 69L100 128M288 51L260 108M288 51L316 108"/>
  <!-- left pan: ready-made package (buy) -->
  <path class="k" d="M40 132H112Q108 152 76 152Q44 152 40 132Z"/>
  <path class="o" d="M36 128H108Q104 148 72 148Q40 148 36 128Z" fill="#fff"/>
  <rect class="k" x="55" y="95" width="44" height="38" rx="4"/>
  <rect class="o" x="50" y="90" width="44" height="38" rx="4" fill="#ffe58f"/>
  <path class="o" d="M50 102H94M72 90V102"/>
  <path class="o" d="M92 92L106 78H120V92L106 106Z" fill="#ffc4f2"/>
  <circle class="k" cx="113" cy="85" r="2.6"/>
